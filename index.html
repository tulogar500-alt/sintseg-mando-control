    function SintsegApp() {
      const [dataLoaded, setDataLoaded] = useState(false);
      const [rolActual, setRolActual] = useState('JEFE');
      const [usuarioActual, setUsuarioActual] = useState('usr-1');
      const [vistaActiva, setVistaActiva] = useState('dashboard');

      const [usuarios, setUsuarios] = useState(INITIAL_USUARIOS);
      const [asuntos, setAsuntos] = useState(INITIAL_ASUNTOS);

      const [documentos, setDocumentos] = useState(INITIAL_DOCUMENTOS);
      const [eventos, setEventos] = useState(INITIAL_EVENTOS);
      const [alertas, setAlertas] = useState(INITIAL_ALERTAS);
      const [trazabilidad, setTrazabilidad] = useState(INITIAL_TRAZABILIDAD);

      const [toast, setToast] = useState(null);
      const showToast = (mensaje, tipo = 'success') => {
        setToast({ mensaje, tipo });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.asuntos) setAsuntos(parsed.asuntos);
            if (parsed.tareas) setTareas(parsed.tareas);
            if (parsed.usuarios) setUsuarios(parsed.usuarios);
            if (parsed.equipos) setEquipos(parsed.equipos);
            if (parsed.documentos) setDocumentos(parsed.documentos);
            if (parsed.eventos) setEventos(parsed.eventos);
            if (parsed.alertas) setAlertas(parsed.alertas);
            if (parsed.trazabilidad) setTrazabilidad(parsed.trazabilidad);
          }
        } catch (err) { console.error('Error al cargar localStorage:', err); }
        setDataLoaded(true);
      }, []);

      useEffect(() => {
        if (!dataLoaded) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ asuntos, tareas, usuarios, equipos, documentos, eventos, alertas, trazabilidad }));
        } catch (err) { console.error('Error guardando localStorage:', err); }

        asignadas.forEach(t => {

          else if (t.prioridad === 'Alta') puntos += 3;

        participando.forEach(() => { puntos += 1; });

                              <span>Densidad de Carga</span><span className="font-bold text-amber-400">{carga.pct}%</span>
                            </div>
                            <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                              <div className="bg-amber-500 h-2 rounded-full" style={{ width: `${carga.pct}%` }}></div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* VISTA 11: CONFIGURACIÓN & RESTAURAR */}
              {vistaActiva === 'configuracion' && (
                <div className="space-y-6">
                  <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
                    <h3 className="text-sm font-bold text-slate-100 uppercase">Configuración de Infraestructura</h3>
                    
                    <div className="bg-slate-950 p-4 rounded-lg border border-slate-800 space-y-2 text-xs">
                      <h4 className="font-bold text-amber-400 uppercase">Restaurar Estado Inicial Semilla</h4>
                      <p className="text-slate-400">Restablece la aplicación borrando las modificaciones de localStorage:</p>
                      <button
                        onClick={() => {
                          localStorage.removeItem(STORAGE_KEY);
                          setAsuntos(INITIAL_ASUNTOS);
                          setTareas(INITIAL_TAREAS);
                          setUsuarios(INITIAL_USUARIOS);
                          setEquipos(INITIAL_EQUIPOS);
                          setDocumentos(INITIAL_DOCUMENTOS);
                          setEventos(INITIAL_EVENTOS);
                          setAlertas(INITIAL_ALERTAS);
                          setTrazabilidad(INITIAL_TRAZABILIDAD);
                          registrarTrazabilidad('Restauración de Datos', 'Sistema', 'Restablecidos datos semilla.');
                          showToast('✓ Datos de demostración restablecidos.', 'success');
                        }}
                        className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded shadow"
                      >
                        🔄 RESTAURAR DATOS DE DEMOSTRACIÓN
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* MODAL REASIGNAR TAREA REAL */}
          {modalReasignarTarea && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-xl p-6 max-w-lg w-full space-y-4">
                <h3 className="text-sm font-bold text-amber-400 uppercase">Reasignar Responsable Principal</h3>
                <p className="text-xs text-slate-300">Tarea: <strong>{modalReasignarTarea.codigo} - {modalReasignarTarea.titulo}</strong></p>
                <div className="max-h-56 overflow-y-auto space-y-1 bg-slate-950 p-2 rounded border border-slate-800 text-xs">
                  {usuarios.map(u => (
                    <div key={u.id} onClick={() => setModalReasignarTarea({...modalReasignarTarea, nuevoId: u.id})} className={`p-2 rounded cursor-pointer ${modalReasignarTarea.nuevoId === u.id ? 'bg-blue-600 text-white font-bold' : 'hover:bg-slate-800 text-slate-300'}`}>
                      {u.nombre} ({u.puesto})
                    </div>
                  ))}
                </div>
                <div className="flex justify-end space-x-2">
                  <button onClick={() => setModalReasignarTarea(null)} className="px-3 py-1.5 bg-slate-800 text-xs text-slate-300 rounded">Cancelar</button>
                  <button
                    onClick={() => {
                      const nId = modalReasignarTarea.nuevoId || modalReasignarTarea.responsablePrincipalId;
                      const nUsr = usuarios.find(u=>u.id===nId);
                      setTareas(prev => prev.map(t => t.id === modalReasignarTarea.id ? { ...t, responsablePrincipalId: nId } : t));
                      registrarTrazabilidad('Reasignación de Tarea', `Tarea ${modalReasignarTarea.codigo}`, `Reasignada a ${nUsr?.nombre}`);
                      setModalReasignarTarea(null);
                      showToast(`✓ Tarea reasignada a ${nUsr?.nombre}`, 'success');
                    }}
                    className="px-4 py-1.5 bg-amber-500 font-bold text-slate-950 text-xs rounded"
                  >
                    Confirmar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SintsegApp />);
  </script>
</body>
</html>
